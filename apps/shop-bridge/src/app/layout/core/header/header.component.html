<header class="w-full neu-card px-5 py-3.5 flex items-center justify-between">
    
    <!-- Brand Logo & Version Pill -->
    <div class="flex items-center space-x-3">
        <a routerLink="/" class="flex items-center space-x-2.5 group">
            <div class="w-9 h-9 rounded-xl neu-btn flex items-center justify-center text-indigo-500 group-hover:text-purple-500 transition-colors">
                <i class="fa-solid fa-store text-base"></i>
            </div>
            <span class="text-lg font-extrabold font-['Outfit'] tracking-tight text-theme-main group-hover:text-indigo-500 transition-colors">
                ShopBridge
            </span>
        </a>
        <span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold neu-input text-indigo-500">
            <span class="w-1.5 h-1.5 rounded-full bg-indigo-500 mr-1 animate-ping"></span>
            Admin
        </span>
    </div>

    <!-- Centered Nav Pills -->
    <nav class="flex items-center space-x-2">
        <a
            routerLink="/"
            routerLinkActive="neu-input text-indigo-500 font-bold"
            class="px-3.5 py-1.5 rounded-xl text-xs font-semibold text-theme-secondary neu-btn transition-all"
        >
            <i class="fa-solid fa-house mr-1.5 text-[10px]"></i>Home
        </a>
        <a
            routerLink="/list"
            routerLinkActive="neu-input text-indigo-500 font-bold"
            class="px-3.5 py-1.5 rounded-xl text-xs font-semibold text-theme-secondary neu-btn transition-all"
        >
            <i class="fa-solid fa-boxes-stacked mr-1.5 text-[10px]"></i>Inventory
        </a>
        <a
            routerLink="/add"
            class="px-3.5 py-1.5 rounded-xl text-xs font-bold neu-btn-primary transition-all active:scale-95"
        >
            <i class="fa-solid fa-plus mr-1.5 text-[10px]"></i>Add Item
        </a>
    </nav>

    <!-- Social Links & Theme Switcher -->
    <div class="flex items-center space-x-2">
        
        <!-- Theme Toggle Switcher -->
        <button
            (click)="toggleTheme()"
            type="button"
            [title]="currentTheme === 'dark' ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
            class="w-8 h-8 rounded-xl neu-btn flex items-center justify-center text-xs transition-colors"
        >
            <i *ngIf="currentTheme === 'dark'" class="fa-solid fa-sun text-amber-400"></i>
            <i *ngIf="currentTheme === 'light'" class="fa-solid fa-moon text-indigo-600"></i>
        </button>

        <!-- Social Buttons -->
        <a
            href="https://x.com/shubhrankR9"
            target="_blank"
            rel="noopener noreferrer"
            title="X (Twitter)"
            class="w-8 h-8 rounded-xl neu-btn flex items-center justify-center text-xs text-theme-secondary transition-colors"
        >
            <i class="fa-brands fa-x-twitter"></i>
        </a>
        <a
            href="https://github.com/ShubhrankR"
            target="_blank"
            rel="noopener noreferrer"
            title="GitHub"
            class="w-8 h-8 rounded-xl neu-btn flex items-center justify-center text-xs text-theme-secondary transition-colors"
        >
            <i class="fa-brands fa-github"></i>
        </a>
        <a
            href="https://www.linkedin.com/in/shubhrankrastogi/"
            target="_blank"
            rel="noopener noreferrer"
            title="LinkedIn"
            class="w-8 h-8 rounded-xl neu-btn flex items-center justify-center text-xs transition-colors"
        >
            <i class="fa-brands fa-linkedin-in text-sky-500"></i>
        </a>
    </div>

</header>
