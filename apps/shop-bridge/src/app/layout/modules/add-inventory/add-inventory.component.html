<div class="w-full max-w-xl mx-auto space-y-6 my-auto py-4">
    
    <!-- Page Header -->
    <div class="space-y-1">
        <div class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-bold neu-input text-emerald-500">
            <i class="fa-solid fa-circle-plus mr-1.5"></i>
            New Product Record
        </div>
        <h1 class="text-2xl sm:text-3xl font-extrabold text-theme-main font-['Outfit']">
            Add Inventory Item
        </h1>
        <p class="text-xs text-theme-secondary font-light">
            Fill in product parameters below to add a new record to ShopBridge catalog.
        </p>
    </div>

    <!-- Neumorphic Form Container -->
    <div class="p-7 neu-card space-y-6">
        <form (ngSubmit)="submit()" class="space-y-5">
            
            <!-- Item Name -->
            <div class="space-y-2">
                <label for="itemName" class="block text-[11px] font-bold text-theme-secondary uppercase tracking-wider">
                    Item Name <span class="text-rose-500">*</span>
                </label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-theme-muted">
                        <i class="fa-solid fa-tag text-xs"></i>
                    </div>
                    <input
                        [(ngModel)]="itemName"
                        id="itemName"
                        name="itemName"
                        type="text"
                        placeholder="e.g. Dell UltraSharp 4K Monitor"
                        class="w-full pl-10 pr-4 py-3 neu-input rounded-xl text-xs text-theme-main focus:outline-none transition-all"
                    />
                </div>
            </div>

            <!-- Item Description -->
            <div class="space-y-2">
                <label for="itemDescription" class="block text-[11px] font-bold text-theme-secondary uppercase tracking-wider">
                    Item Description <span class="text-rose-500">*</span>
                </label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-theme-muted">
                        <i class="fa-solid fa-align-left text-xs"></i>
                    </div>
                    <input
                        [(ngModel)]="itemDescription"
                        id="itemDescription"
                        name="itemDescription"
                        type="text"
                        placeholder="e.g. 27-inch IPS display with USB-C Hub"
                        class="w-full pl-10 pr-4 py-3 neu-input rounded-xl text-xs text-theme-main focus:outline-none transition-all"
                    />
                </div>
            </div>

            <!-- Item Price -->
            <div class="space-y-2">
                <label for="itemPrice" class="block text-[11px] font-bold text-theme-secondary uppercase tracking-wider">
                    Price (INR ₹) <span class="text-rose-500">*</span>
                </label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-theme-muted font-mono text-xs">
                        ₹
                    </div>
                    <input
                        [(ngModel)]="itemPrice"
                        id="itemPrice"
                        name="itemPrice"
                        type="number"
                        placeholder="e.g. 25000"
                        class="w-full pl-10 pr-4 py-3 neu-input rounded-xl text-xs font-mono text-theme-main focus:outline-none transition-all"
                    />
                </div>
            </div>

            <!-- Empty Fields Alert -->
            <div *ngIf="isFieldsEmpty" class="p-3.5 rounded-xl neu-input text-rose-500 text-xs font-medium flex items-center space-x-2.5">
                <i class="fa-solid fa-triangle-exclamation text-rose-500 text-sm flex-shrink-0"></i>
                <span>Please fill in all required fields (Name, Description, and Price) before submitting.</span>
            </div>

            <!-- Success Alert -->
            <div *ngIf="isItemAdded" class="p-4 rounded-xl neu-input text-emerald-500 text-xs font-medium space-y-3">
                <div class="flex items-center space-x-2.5">
                    <i class="fa-solid fa-circle-check text-emerald-500 text-sm flex-shrink-0"></i>
                    <span>Item added to inventory successfully!</span>
                </div>
                <div class="pt-1 flex items-center space-x-2.5">
                    <button
                        (click)="addMore()"
                        type="button"
                        class="px-3.5 py-1.5 rounded-xl neu-btn-emerald font-semibold text-xs transition-all"
                    >
                        <i class="fa-solid fa-plus mr-1"></i> Add Another
                    </button>
                    <a
                        routerLink="/list"
                        class="px-3.5 py-1.5 rounded-xl neu-btn text-theme-main font-semibold text-xs transition-all"
                    >
                        View List
                    </a>
                </div>
            </div>

            <!-- Buttons -->
            <div *ngIf="!isItemAdded" class="flex items-center justify-end space-x-3 pt-3 border-t border-slate-700/30">
                <button
                    (click)="resetForm()"
                    type="button"
                    class="px-4 py-2 rounded-xl neu-btn text-theme-muted hover:text-theme-main text-xs font-bold uppercase tracking-wider transition-all"
                >
                    <i class="fa-solid fa-rotate-left mr-1.5"></i> Clear
                </button>
                <button
                    type="submit"
                    class="px-5 py-2.5 rounded-xl neu-btn-emerald text-xs font-bold uppercase tracking-wider transition-all active:scale-95"
                >
                    <i class="fa-solid fa-check mr-1.5"></i> Add Product
                </button>
            </div>

        </form>
    </div>

</div>
