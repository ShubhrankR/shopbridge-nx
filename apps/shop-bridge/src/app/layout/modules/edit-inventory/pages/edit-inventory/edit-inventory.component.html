<ng-container *ngIf="isItemLoadedFromInventory; else showLoading">
    <div class="w-full max-w-xl mx-auto space-y-6 my-auto py-4">
        
        <!-- Header -->
        <div class="space-y-1">
            <div class="inline-flex items-center px-2.5 py-0.5 rounded-full text-[10px] font-bold neu-input text-indigo-500">
                <i class="fa-solid fa-pen-to-square mr-1.5"></i>
                Edit Item #{{ itemIdFromRoute }}
            </div>
            <h1 class="text-2xl sm:text-3xl font-extrabold text-theme-main font-['Outfit']">
                Update Product Details
            </h1>
            <p class="text-xs text-theme-secondary font-light">
                Modify product details or delete item from the ShopBridge catalog.
            </p>
        </div>

        <!-- Form Card -->
        <div class="p-7 neu-card space-y-6">
            <form (ngSubmit)="onUpdate()" class="space-y-5">
                
                <!-- Item Name -->
                <div class="space-y-2">
                    <label for="itemName" class="block text-[11px] font-bold text-theme-secondary uppercase tracking-wider">
                        Item Name
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-theme-muted">
                            <i class="fa-solid fa-tag text-xs"></i>
                        </div>
                        <input
                            [(ngModel)]="itemName"
                            id="itemName"
                            name="itemName"
                            type="text"
                            placeholder="Enter item name"
                            class="w-full pl-10 pr-4 py-3 neu-input rounded-xl text-xs text-theme-main focus:outline-none transition-all"
                        />
                    </div>
                </div>

                <!-- Item Description -->
                <div class="space-y-2">
                    <label for="itemDescription" class="block text-[11px] font-bold text-theme-secondary uppercase tracking-wider">
                        Item Description
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-theme-muted">
                            <i class="fa-solid fa-align-left text-xs"></i>
                        </div>
                        <input
                            [(ngModel)]="itemDescription"
                            id="itemDescription"
                            name="itemDescription"
                            type="text"
                            placeholder="Enter item description"
                            class="w-full pl-10 pr-4 py-3 neu-input rounded-xl text-xs text-theme-main focus:outline-none transition-all"
                        />
                    </div>
                </div>

                <!-- Item Price -->
                <div class="space-y-2">
                    <label for="itemPrice" class="block text-[11px] font-bold text-theme-secondary uppercase tracking-wider">
                        Price (INR ₹)
                    </label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-theme-muted font-mono text-xs">
                            ₹
                        </div>
                        <input
                            [(ngModel)]="itemPrice"
                            id="itemPrice"
                            name="itemPrice"
                            type="number"
                            placeholder="Enter item price"
                            class="w-full pl-10 pr-4 py-3 neu-input rounded-xl text-xs font-mono text-theme-main focus:outline-none transition-all"
                        />
                    </div>
                </div>

                <!-- No Changes Alert -->
                <div *ngIf="isItemInfoNotUpdated" class="p-3.5 rounded-xl neu-input text-amber-500 text-xs font-medium flex items-center space-x-2.5">
                    <i class="fa-solid fa-circle-info text-amber-500 text-sm flex-shrink-0"></i>
                    <span>No changes detected. Update at least one field before saving.</span>
                </div>

                <!-- Updated Alert -->
                <div *ngIf="isItemUpdated" class="p-4 rounded-xl neu-input text-emerald-500 text-xs font-medium space-y-3">
                    <div class="flex items-center space-x-2.5">
                        <i class="fa-solid fa-circle-check text-emerald-500 text-sm flex-shrink-0"></i>
                        <span>Item updated successfully!</span>
                    </div>
                    <div class="pt-1 flex items-center space-x-2.5">
                        <a
                            routerLink="/list"
                            class="px-3.5 py-1.5 rounded-xl neu-btn-emerald font-semibold text-xs transition-all"
                        >
                            Back to Inventory
                        </a>
                        <a
                            routerLink="/"
                            class="px-3.5 py-1.5 rounded-xl neu-btn text-theme-main font-semibold text-xs transition-all"
                        >
                            Home
                        </a>
                    </div>
                </div>

                <!-- Buttons -->
                <div *ngIf="!isItemUpdated" class="flex items-center justify-between pt-3 border-t border-slate-700/30">
                    <button
                        (click)="triggerDeleteWorkflow()"
                        type="button"
                        class="px-4 py-2 rounded-xl neu-btn-rose text-xs font-bold uppercase tracking-wider transition-all"
                    >
                        <i class="fa-solid fa-trash-can mr-1.5"></i> Delete
                    </button>
                    
                    <button
                        type="submit"
                        class="px-5 py-2.5 rounded-xl neu-btn-primary text-xs font-bold uppercase tracking-wider transition-all active:scale-95"
                    >
                        <i class="fa-solid fa-arrows-rotate mr-1.5"></i> Save Changes
                    </button>
                </div>

            </form>
        </div>

    </div>
</ng-container>

<ng-template #showLoading>
    <thinkbridge-page-loader></thinkbridge-page-loader>
</ng-template>
