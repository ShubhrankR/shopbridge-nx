name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Angular Application
        run: npx nx build shop-bridge --base-href=/shopbridge-nx/

      - name: Create SPA 404 Fallback for GitHub Pages Routing
        run: cp dist/apps/shop-bridge/index.html dist/apps/shop-bridge/404.html

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/apps/shop-bridge'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
